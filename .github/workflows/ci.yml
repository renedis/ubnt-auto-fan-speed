name: CI
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts (errors only)
        run: shellcheck -S error on_boot.d/11-ubnt-auto-fan-speed.sh on_boot.d/install.sh
